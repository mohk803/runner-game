<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مغامرة بطل الجحيشي</title>
    <style>
        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
            background: #87CEEB;
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; }
        
        #start-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('hero_image.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .game-title {
            font-size: 38px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 3px 3px 6px #000, 0 0 15px #e74c3c;
            margin-bottom: 10px;
        }
        .game-desc {
            font-size: 18px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
        }
        .start-btn {
            padding: 14px 45px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: 3px solid #f1c40f;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }

        #ui-layer {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none;
            flex-direction: column;
            gap: 8px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
        }
        #game-over-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
            z-index: 60;
        }
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-around;
            padding: 0 15px;
            z-index: 20;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #fff;
            color: white;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1 class="game-title">مغامرة بطل الجحيشي</h1>
        <p class="game-desc">انطلق بالراية وتفادَ العوائق عبر القرية التراثية</p>
        <button class="start-btn" onclick="startGame()">ابدأ المغامرة 🚀</button>
    </div>

    <div id="ui-layer">
        <div>النقاط: <span id="score-val">0</span></div>
        <div>المسافة: <span id="distance-val">0</span> م</div>
    </div>

    <div id="game-over-screen">
        <div>اصطدمت بالعائق!</div>
        <button class="start-btn" style="margin-top: 20px;" onclick="location.reload()">إعادة المحاولة</button>
    </div>

    <div id="mobile-controls">
        <div class="ctrl-btn" onclick="moveLeft()">⬅️</div>
        <div class="ctrl-btn" onclick="jump()">⬆️</div>
        <div class="ctrl-btn" onclick="slide()">⬇️</div>
        <div class="ctrl-btn" onclick="moveRight()">➡️</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87ceeb, 20, 110);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.5, 9);
        camera.lookAt(0, 1.8, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.3));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
        dirLight.position.set(5, 20, 10);
        scene.add(dirLight);

        const lanes = [-2.8, 0, 2.8];
        let currentLaneIndex = 1;
        let isJumping = false;
        let isSliding = false;
        let yVelocity = 0;
        const gravity = -0.016;

        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const flagPole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.04, 0.04, 2.8),
            new THREE.MeshStandardMaterial({ color: 0xd4af37 })
        );
        flagPole.position.set(0.4, 1.5, 0);
        playerGroup.add(flagPole);

        const flagBanner = new THREE.Mesh(
            new THREE.BoxGeometry(0.05, 0.7, 1.1),
            new THREE.MeshStandardMaterial({ color: 0xc0392b })
        );
        flagBanner.position.set(0.4, 2.5, -0.45);
        playerGroup.add(flagBanner);

        const heroBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.35, 0.35, 1.2, 16),
            new THREE.MeshStandardMaterial({ color: 0x2c3e50 })
        );
        heroBody.position.y = 0.9;
        playerGroup.add(heroBody);

        const cloud = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.65, 1),
            new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3 })
        );
        cloud.position.y = 0.25;
        cloud.scale.set(1.4, 0.5, 1.8);
        playerGroup.add(cloud);

        let mixer;
        const loader = new THREE.GLTFLoader();
        loader.load('hero.glb', (gltf) => {
            playerGroup.remove(heroBody);
            const model = gltf.scene;
            model.scale.set(1.1, 1.1, 1.1);
            model.position.y = 0.3;
            playerGroup.add(model);
            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                mixer.clipAction(gltf.animations[0]).play();
            }
        }, undefined, () => {});

        const track = new THREE.Mesh(
            new THREE.PlaneGeometry(10, 300),
            new THREE.MeshStandardMaterial({ color: 0x3d566e })
        );
        track.rotation.x = -Math.PI / 2;
        scene.add(track);

        const sideHouses = [];
        const colors = [0xe74c3c, 0x3498db, 0x9b59b6, 0xf39c12, 0x2ecc71];
        for (let z = 0; z > -200; z -= 15) {
            [-6.5, 6.5].forEach(x => {
                const house = new THREE.Mesh(
                    new THREE.BoxGeometry(3, 4, 3),
                    new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] })
                );
                house.position.set(x, 2, z);
                scene.add(house);
                sideHouses.push(house);
            });
        }

        const obstacles = [];
        const coins = [];
        const obsGeo = new THREE.BoxGeometry(1.6, 1.4, 1);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0x7a3e1d });
        const coinGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffaa00 });

        function spawnObstacle(zPos) {
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set(lane, 0.7, zPos);
            scene.add(obs);
            obstacles.push(obs);

            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.position.set(lane, 2.3, zPos);
            scene.add(coin);
            coins.push(coin);
        }

        for (let z = -25; z > -160; z -= 25) {
            spawnObstacle(z);
        }

        function moveLeft() { if (currentLaneIndex > 0) currentLaneIndex--; }
        function moveRight() { if (currentLaneIndex < 2) currentLaneIndex++; }
        function jump() {
            if (!isJumping) {
                isJumping = true;
                yVelocity = 0.28;
            }
        }
        function slide() {
            if (!isSliding) {
                isSliding = true;
                playerGroup.scale.set(1, 0.45, 1);
                setTimeout(() => {
                    playerGroup.scale.set(1, 1, 1);
                    isSliding = false;
                }, 650);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
            else if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
            else if (e.key === 'ArrowDown' || e.key === 's') slide();
        });

        let score = 0;
        let distance = 0;
        let gameActive = false;
        const speed = 0.48;
        const clock = new THREE.Clock();

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            document.getElementById('mobile-controls').style.display = 'flex';
            gameActive = true;
            animate();
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            const targetX = lanes[currentLaneIndex];
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;

            if (isJumping) {
                playerGroup.position.y += yVelocity;
                yVelocity += gravity;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    isJumping = false;
                }
            }

            flagBanner.rotation.y = Math.sin(Date.now() * 0.008) * 0.25;

            sideHouses.forEach(h => {
                h.position.z += speed;
                if (h.position.z > 15) h.position.z = -185;
            });

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                if (Math.abs(obs.position.z - playerGroup.position.z) < 1.1 &&
                    Math.abs(obs.position.x - playerGroup.position.x) < 1.1 &&
                    playerGroup.position.y < 1.1) {
                    gameOver();
                }

                if (obs.position.z > 12) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    spawnObstacle(-130);
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.position.z += speed;
                coin.rotation.y += 0.04;

                if (Math.abs(coin.position.z - playerGroup.position.z) < 1.1 &&
                    Math.abs(coin.position.x - playerGroup.position.x) < 1.1 &&
                    playerGroup.position.y < 2.2) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                    score += 10;
                    document.getElementById('score-val').textContent = score;
                }

                if (coin.position.z > 12) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            distance += 1;
            document.getElementById('distance-val').textContent = Math.floor(distance / 10);
            renderer.render(scene, camera);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
